<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CEWP Stockfish Example</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      line-height: 1.4;
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
    }
    .card {
      border: 1px solid #9994;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    pre {
      overflow: auto;
      padding: 12px;
      border-radius: 8px;
      background: #0001;
    }
    .muted {
      opacity: 0.75;
    }
    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      word-break: break-word;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #9994;
      font-size: 12px;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CEWP Stockfish Example</h1>
    <p class="muted">
      Reference web plugin for the Chess Engine Web Protocol.
    </p>

    <div class="card">
      <div class="grid">
        <div>
          <div><span class="badge">Plugin</span> <span id="pluginName">Loading…</span></div>
          <div><span class="badge">State</span> <span id="state">idle</span></div>
          <div><span class="badge">Engine</span> <span id="engineStatus">not loaded</span></div>
        </div>
        <div>
          <div><span class="badge">Last FEN</span></div>
          <div id="fen" class="mono">—</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Latest analysis</h2>
      <div><strong>Depth:</strong> <span id="depth">—</span></div>
      <div><strong>Score:</strong> <span id="score">—</span></div>
      <div><strong>Best move:</strong> <span id="bestMove">—</span></div>
      <div><strong>PV:</strong></div>
      <pre id="pv">—</pre>
    </div>

    <div class="card">
      <h2>Debug log</h2>
      <pre id="log"></pre>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
